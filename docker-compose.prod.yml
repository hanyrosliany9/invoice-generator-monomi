name: invoice-prod

services:
  # Frontend Production Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production-node
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-0}
    container_name: invoice-frontend-prod
    # Command is defined in Dockerfile CMD
    environment:
      - TZ=Asia/Jakarta
      - NODE_ENV=production
      - FRONTEND_PORT=3000
      - BACKEND_URL=http://app:5000
    # No host port publish: nginx reaches the SPA over the internal Docker
    # network (upstream frontend -> frontend:3000). Publishing host :3000 was
    # debug-only and collided with another tenant squatting :3000 on the VPS.
    expose:
      - "3000"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - invoice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Backend API Server (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: invoice-app-prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Note: Port 8081 is NOT exposed to host (only internal Docker network)
    # Cloudflare Tunnel #2 connects directly to app:8081 inside Docker network
    environment:
      - TZ=Asia/Jakarta
      - NODE_ENV=production
      - DATABASE_URL=postgresql://invoiceuser:${DB_PASSWORD}@db:5432/invoices
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}
      # File Storage Configuration
      - UPLOAD_PATH=/app/uploads
      - CORS_ORIGIN=https://admin.monomiagency.com
      - FRONTEND_URL=https://admin.monomiagency.com
      # Client portal: separate session secret (required in production — the
      # app refuses to boot without it) and the portal origin for CORS/emails.
      - PORTAL_JWT_SECRET=${PORTAL_JWT_SECRET:?PORTAL_JWT_SECRET must be set in .env}
      - PORTAL_URL=https://portal.monomiagency.com
      # Instagram API with Instagram Login (optional — app boots without it).
      # TOKEN_ENCRYPTION_KEY is required once META_APP_ID/SECRET are set; without
      # it (or with a placeholder) Instagram is DISABLED with a boot warning.
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_GRAPH_VERSION=${META_GRAPH_VERSION:-v26.0}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      - INSTAGRAM_REDIRECT_URI=${INSTAGRAM_REDIRECT_URI:-https://admin.monomiagency.com/api/v1/instagram/oauth/callback}
      - INSTAGRAM_PORTAL_REDIRECT_URI=${INSTAGRAM_PORTAL_REDIRECT_URI:-https://portal.monomiagency.com/api/v1/instagram/oauth/callback}
      # Auto-publish Monomi's own posts to Instagram + Facebook Page (optional —
      # empty = feature off). System user token from Meta Business Settings.
      - META_SYSTEM_USER_TOKEN=${META_SYSTEM_USER_TOKEN:-}
      - META_PAGE_ID=${META_PAGE_ID:-}
      - META_IG_USER_ID=${META_IG_USER_ID:-}
      - META_SYSTEM_APP_SECRET=${META_SYSTEM_APP_SECRET:-}
      - META_AUTOPUBLISH_ENABLED=${META_AUTOPUBLISH_ENABLED:-true}

      # WhatsApp inbox + Conversions API (optional — app boots without them).
      # A partial/invalid set never blocks boot: WhatsApp is disabled and the
      # problems are logged + listed in CRM > Settings.
      # Webhook: https://admin.monomiagency.com/api/v1/whatsapp/webhook
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_WABA_ID=${WHATSAPP_WABA_ID:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      - WHATSAPP_APP_ID=${WHATSAPP_APP_ID:-}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET:-}
      - WHATSAPP_COEXISTENCE_ENABLED=${WHATSAPP_COEXISTENCE_ENABLED:-false}
      - WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID=${WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID:-}
      - WHATSAPP_HISTORY_LEAD_MAX_AGE_DAYS=${WHATSAPP_HISTORY_LEAD_MAX_AGE_DAYS:-30}
      - WHATSAPP_HISTORY_SYNC_ENABLED=${WHATSAPP_HISTORY_SYNC_ENABLED:-true}
      - WHATSAPP_SMB_SYNC_EDGE=${WHATSAPP_SMB_SYNC_EDGE:-smb_app_data}
      - WHATSAPP_APPSECRET_PROOF=${WHATSAPP_APPSECRET_PROOF:-true}
      - META_DATASET_ID=${META_DATASET_ID:-}
      - META_CAPI_ENABLED=${META_CAPI_ENABLED:-false}
      - META_CAPI_TEST_EVENT_CODE=${META_CAPI_TEST_EVENT_CODE:-}
      # Landing page tracking (website Conversions API); see docs/landing-page-tracking.md
      - META_PIXEL_ID=${META_PIXEL_ID:-}
      - META_WEB_CAPI_TOKEN=${META_WEB_CAPI_TOKEN:-}
      - META_WEB_CAPI_ENABLED=${META_WEB_CAPI_ENABLED:-false}
      - META_WEB_CAPI_TEST_EVENT_CODE=${META_WEB_CAPI_TEST_EVENT_CODE:-}
      - PUBLIC_TRACK_ALLOWED_ORIGINS=${PUBLIC_TRACK_ALLOWED_ORIGINS:-https://link.monomiagency.com}
      - LANDING_PAGE_URL=${LANDING_PAGE_URL:-https://link.monomiagency.com}
      - PUBLIC_TRACK_MAX_NEW_PER_MIN=${PUBLIC_TRACK_MAX_NEW_PER_MIN:-600}
      - AD_CLICK_PII_RETENTION_DAYS=${AD_CLICK_PII_RETENTION_DAYS:-90}
      - PUBLIC_TRACK_MAX_AUTO_LEADS_PER_HOUR=${PUBLIC_TRACK_MAX_AUTO_LEADS_PER_HOUR:-60}
      - AUTO_LEAD_STALE_DAYS=${AUTO_LEAD_STALE_DAYS:-30}
      - PUBLIC_URL=https://share.monomiagency.com
      - MEDIA_URL=https://media.monomiagency.com
      # MCP custom connector — Claude.ai users connect via the admin hostname
      # (NOT share/media). All OAuth callbacks and consent pages live here.
      - MCP_PUBLIC_URL=https://admin.monomiagency.com
      - LOG_LEVEL=info
      - SKIP_DB_INIT=true
      - WEBSOCKET_PORT=${WEBSOCKET_PORT}
      - WEBSOCKET_CORS_ORIGIN=${WEBSOCKET_CORS_ORIGIN}
      # WebSocket & Real-time Collaboration
      - SOCKET_IO_CORS_ORIGIN=${SOCKET_IO_CORS_ORIGIN}
      - VITE_WS_URL=${VITE_WS_URL}
      # PDF Export (Puppeteer)
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - TEMP_EXPORT_DIR=/app/temp/exports
      # Cloudflare R2 Storage
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-monomi-finance}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - R2_ENDPOINT=${R2_ENDPOINT}
      # File size limit for uploads (500MB for bulk download ZIPs)
      - MAX_FILE_SIZE_MB=500
    networks:
      - invoice-network
    volumes:
      - ./uploads:/app/uploads:rw
      - ./storage:/app/storage:rw
      - ./logs:/app/logs:rw
      - ./backup:/app/backup:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
  # Database Service (Production)
  db:
    image: postgres:15-alpine
    container_name: invoice-db-prod
    environment:
      - TZ=Asia/Jakarta
      - PGTZ=Asia/Jakarta
      - POSTGRES_DB=invoices
      - POSTGRES_USER=invoiceuser
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./backup:/backup:rw
    networks:
      - invoice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceuser -d invoices"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=10000
      -c pg_stat_statements.track=all
      -c log_statement=none
      -c log_min_duration_statement=1000
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
    
  # Redis for session management and caching (Production)
  redis:
    image: redis:7-alpine
    container_name: invoice-redis-prod
    environment:
      - TZ=Asia/Jakarta
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_prod_data:/data
    networks:
      - invoice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    
  # Reverse proxy for Cloudflare Tunnel
  nginx:
    image: nginx:alpine
    container_name: invoice-nginx-prod
    environment:
      - TZ=Asia/Jakarta
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    # Loopback only: public traffic arrives through the Cloudflare tunnel over
    # the Docker network. Publishing on all interfaces let the internet bypass
    # Cloudflare, and docker-proxy traffic (e.g. IPv6) arrives from the bridge
    # gateway, which nginx trusts for CF-Connecting-IP.
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx-cloudflare.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx:rw
    networks:
      - invoice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Cloudflare Tunnel #1 (Main App - HTTP/REST API)
  cloudflared:
    image: cloudflare/cloudflared:2025.2.1
    container_name: invoice-cloudflared-prod
    environment:
      - TZ=Asia/Jakarta
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - invoice-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # Cloudflare Tunnel #2 (WebSocket - Real-time Collaboration)
  cloudflared-ws:
    image: cloudflare/cloudflared:2025.2.1
    container_name: invoice-cloudflared-ws-prod
    environment:
      - TZ=Asia/Jakarta
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_WS_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - invoice-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.125'
          memory: 64M

  # Database backup service
  backup:
    image: postgres:15-alpine
    container_name: invoice-backup-prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=Asia/Jakarta
      - PGTZ=Asia/Jakarta
      - POSTGRES_DB=invoices
      - POSTGRES_USER=invoiceuser
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGPASSWORD=${DB_PASSWORD}
    volumes:
      - ./backup:/backup:rw
      - ./scripts:/scripts:ro
    networks:
      - invoice-network
    restart: on-failure
    command: |
      sh -c "
        while ! pg_isready -h db -U invoiceuser; do
          echo 'Waiting for database...'
          sleep 2
        done
        echo 'Database is ready, starting backup service...'
        while true; do
          pg_dump -h db -U invoiceuser -d invoices > /backup/backup_$$(date +%Y%m%d_%H%M%S).sql
          echo 'Backup completed at $$(date)'
          find /backup -name '*.sql' -mtime +7 -delete
          echo 'Old backups pruned (retention: 7 days)'
          sleep 86400
        done
      "
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  
networks:
  invoice-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16